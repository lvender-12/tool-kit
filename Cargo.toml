[package]
name = "rust-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "3.1.1"
config = "0.15.22"
dialoguer = "0.12.0"
rayon = "1.12.0"
reqwest = { version = "0.13.3", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
